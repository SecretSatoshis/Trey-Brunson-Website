name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Use the runner's refreshed CA bundle rather than Node's embedded roots.
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Refresh TLS certificate trust
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade -y ca-certificates
          # Enforce the emergency distrust even if this runner's apt mirror lags.
          sudo sed -i \
            -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt$|!&|' \
            -e 's|^mozilla/emSign_Root_TLS_CA_-_G3.crt$|!&|' \
            -e 's|^mozilla/Comodo_AAA_Services_root.crt$|!&|' \
            /etc/ca-certificates.conf
          sudo update-ca-certificates
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
