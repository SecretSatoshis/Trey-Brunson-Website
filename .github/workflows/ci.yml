name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Refresh TLS certificate trust
        uses: SecretSatoshis/.github/actions/refresh-tls-trust@deb19758624b41175b649a18223ee978bab34bcc
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: SecretSatoshis/.github/actions/setup-node-pnpm@deb19758624b41175b649a18223ee978bab34bcc
        with:
          node-version-file: .nvmrc
          pnpm-version: "11.19.0"
          cache: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
